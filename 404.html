<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=index.html" />
  <title>Page Not Found</title>
  <script>
    (function () {
      const hash = window.location.hash || '';
      window.location.replace('index.html' + hash);
    })();
  </script>
</head>
<body>
  <p>Redirecting to the homepage...</p>
</body>
</html>
